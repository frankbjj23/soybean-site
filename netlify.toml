"$schema" = "https://open-api.netlify.com/netlify.schema.json"

[build]
  command = "node scripts/build.cjs"
  publish = "dist"

[[redirects]]
  from = "/buy-soybeans"
  to = "/buy-soybeans.html"
  status = 200

[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200

[[redirects]]
  from = "/corn"
  to = "/corn.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
